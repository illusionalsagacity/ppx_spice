name: ppx_spice publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build and publish from"
        required: false
      repository:
        description: "owner/repo to check out (use fork to test external PRs)"
        required: false
      npm_tag:
        description: "npm dist-tag to publish under (e.g., latest, next)"
        required: false
        default: latest

env:
  TARGET_REF: ${{ github.event.inputs.ref || github.ref }}
  TARGET_REPO: ${{ github.event.inputs.repository || github.repository }}
  NPM_TAG: ${{ github.event.inputs.npm_tag || 'latest' }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.ref }}
      repository: ${{ github.event.inputs.repository }}

  publish:
    needs: build
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC publish to npm
      contents: write # Required for creating GitHub releases
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download PPX binaries
        uses: actions/download-artifact@v7
        with:
          pattern: ppx-*
          merge-multiple: true
          path: .

      - name: Check all binaries are present
        run: |
          ls -l ppx-*.exe
          for f in ppx-linux-x64.exe ppx-linux-arm64.exe ppx-osx-x64.exe ppx-osx-arm64.exe ppx-windows.exe; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

      # Artifacts lose their executable bit on upload
      - name: Set executable permissions
        run: chmod +x ppx-linux-x64.exe ppx-linux-arm64.exe ppx-osx-x64.exe ppx-osx-arm64.exe

      - name: Pack package
        run: npm pack

      - name: Publish
        run: |
          if [ "${NPM_TAG:-latest}" = "latest" ]; then
            npm publish --provenance
          else
            npm publish --provenance --tag "${NPM_TAG}"
          fi

      - name: Create GitHub Release
        if: startsWith(env.TARGET_REF, 'refs/tags/') || startsWith(env.TARGET_REF, 'v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TARGET_REF }}
          name: Release ${{ env.TARGET_REF }}
          generate_release_notes: true
          files: |
            ppx-linux-x64.exe
            ppx-linux-arm64.exe
            ppx-osx-x64.exe
            ppx-osx-arm64.exe
            ppx-windows.exe
